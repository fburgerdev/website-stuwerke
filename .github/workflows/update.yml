name: Update data
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch menus and rebuild
        run: |
          python pipeline/update.py --weeks 2
          python pipeline/build.py
      - name: Commit
        run: |
          git config user.name "mensa-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet || git commit -m "data: daily update"
          git push
